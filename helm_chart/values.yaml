namespace: lmw-harness

webserver:
  port: 5052
  type: NodePort
  nodePort: 31313
  host: lmw-fitness-webserver.lmw-harness.svc.cluster.local
  path: /
  pathType: Prefix

image:
  repository: lmwcode/lmw_fitness_webserver
  pullPolicy: Always
  tag: v.<+pipeline.sequenceId>

replicaCount: 1

api:
  port: 8082
  path: /api/

livenessProbe:
  initialDelaySeconds: 30
  timeoutSeconds: 5
  periodSeconds: 10
  failureThreshold: 3
readinessProbe:
  initialDelaySeconds: 15
  timeoutSeconds: 5
  periodSeconds: 10
  failureThreshold: 3
